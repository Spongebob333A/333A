<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#52677f" stroke-width="1.8"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19334d" flood-opacity=".08"/></filter>
  <style>
    .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
    .actor-line { stroke:#52677f; stroke-width:2.4; fill:none; stroke-linecap:round; }
    .uc { fill:#fff; stroke:#4384ad; stroke-width:2.5; filter:url(#shadow); }
    .uc-text { font-size:24px; fill:#18344c; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
  </style>
</defs>
<rect width="1800" height="1260" fill="#f4f7fb"/>
<text class="cn" x="900" y="68" text-anchor="middle" font-size="38" font-weight="700" fill="#17334d">用户身份与老人—家属绑定子系统用例图</text>
<text class="cn" x="900" y="110" text-anchor="middle" font-size="19" fill="#60758a">目标设计｜账号认证与跨设备绑定属于后续后端扩展</text>
<!-- system boundary -->
<rect x="245" y="158" width="1310" height="1005" rx="24" fill="#ffffff" stroke="#8ca9bd" stroke-width="2.5"/>
<path d="M269 158 H1531 Q1555 158 1555 182 V234 H245 V182 Q245 158 269 158Z" fill="#eaf2f8"/>
<text class="cn" x="900" y="198" text-anchor="middle" font-size="25" font-weight="700" fill="#244b68">用户身份与老人—家属绑定系统</text>
<line x1="245" y1="234" x2="1555" y2="234" stroke="#d7e2ea" stroke-width="2"/>
<!-- actors -->
<g class="cn" stroke="#334b60" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- elder -->
  <circle cx="112" cy="555" r="19" fill="#f4f7fb"/><path d="M112 575 V644 M78 601 H146 M112 644 L83 683 M112 644 L141 683"/>
  <!-- family -->
  <circle cx="1688" cy="555" r="19" fill="#f4f7fb"/><path d="M1688 575 V644 M1654 601 H1722 M1688 644 L1659 683 M1688 644 L1717 683"/>
</g>
<text class="cn" x="112" y="718" text-anchor="middle" font-size="24" font-weight="600" fill="#243e55">老人用户</text>
<text class="cn" x="1688" y="718" text-anchor="middle" font-size="24" font-weight="600" fill="#243e55">家属用户</text>
<!-- actor associations -->
<g class="actor-line">
  <path d="M150 593 L470 400"/>
  <path d="M150 614 L470 620"/>
  <path d="M150 635 L770 820"/>
  <path d="M150 652 L770 1015"/>
  <path d="M1650 593 L1330 400"/>
  <path d="M1650 635 L1030 820"/>
  <path d="M1650 652 L1030 1015"/>
</g>
<!-- use cases -->
<ellipse class="uc" cx="610" cy="400" rx="180" ry="59"/>
<text class="cn uc-text" x="610" y="400">生成绑定码</text>
<ellipse class="uc" cx="1190" cy="400" rx="180" ry="59"/>
<text class="cn uc-text" x="1190" y="390"><tspan x="1190">输入绑定码</tspan><tspan x="1190" dy="30">并提交绑定申请</tspan></text>
<ellipse class="uc" cx="610" cy="620" rx="180" ry="59"/>
<text class="cn uc-text" x="610" y="610"><tspan x="610">审核绑定申请</tspan><tspan x="610" dy="30">并确认或拒绝</tspan></text>
<ellipse class="uc" cx="1190" cy="620" rx="180" ry="59"/>
<text class="cn uc-text" x="1190" y="620">校验绑定码</text>
<ellipse class="uc" cx="900" cy="820" rx="205" ry="59"/>
<text class="cn uc-text" x="900" y="820">查询当前绑定关系</text>
<ellipse class="uc" cx="900" cy="1015" rx="205" ry="59"/>
<text class="cn uc-text" x="900" y="1015">解除绑定关系</text>
<!-- include: submit request includes code validation -->
<path d="M1190 459 L1190 554" stroke="#52677f" stroke-width="2.4" stroke-dasharray="9 7" fill="none" marker-end="url(#arrow)"/>
<rect x="1208" y="487" width="120" height="30" rx="8" fill="#fff"/>
<text class="cn" x="1268" y="508" text-anchor="middle" font-size="19" font-weight="600" fill="#52677f">«include»</text>
<!-- UML legend and implementation status -->
<line x1="340" y1="1100" x2="405" y2="1100" class="actor-line"/>
<text class="cn" x="420" y="1107" font-size="17" fill="#536a7e">实线关联：角色参与相应用例</text>
<line x1="705" y1="1100" x2="770" y2="1100" stroke="#52677f" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text class="cn" x="790" y="1107" font-size="17" fill="#536a7e">«include»：提交申请时必须校验绑定码</text>
<rect x="295" y="1130" width="1210" height="1" fill="#e2eaf0"/>
<text class="cn" x="900" y="1150" text-anchor="middle" font-size="17" fill="#8a5b30">当前版本说明：应用支持同一设备上的老人端/家属端角色切换；账号认证、绑定码及跨设备关系尚未实现。</text>
</svg>

